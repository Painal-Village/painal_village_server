spring.application.name=painal_village
server.port=${PORT:8080}
server.address=0.0.0.0

spring.datasource.url=${PS_DB_URL}
spring.datasource.username=${PS_DB_USER}
spring.datasource.password=${PS_DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

supabase.storage.base-url=https://pxytwvgrvlaycdnljjht.supabase.co/storage/v1/object/public/painal_village